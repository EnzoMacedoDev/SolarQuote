spring.application.name=solarquote

# ==========================================
# PORTA
# ==========================================
server.port=${PORT:8080}

# ==========================================
# PostgreSQL
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Nao deixar o Hibernate criar/alterar tabelas sozinho.
spring.jpa.hibernate.ddl-auto=validate

# Mostra o SQL gerado no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT
# ==========================================
solarquote.jwt.secret=${JWT_SECRET}
solarquote.jwt.expiracao-ms=${JWT_EXPIRATION_MS:86400000}